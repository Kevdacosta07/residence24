services:
  residence24:
    container_name: residence24-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      VIRTUAL_HOST: ${VIRTUAL_HOST:-residence24.ch,www.residence24.ch}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-residence24.ch,www.residence24.ch}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-contact@residence24.ch}
      VIRTUAL_PORT: 3000
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
